<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>CINEVERSE — Cinematic Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0f;
    --bg2: #14141d;
    --accent: #ff3860;
    --accent2: #ffd23f;
    --accent3: #6450ff;
    --text: #f5f5f7;
    --muted: #8a8a96;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ ANIMATED BACKGROUND ============ */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,56,96,0.18), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,210,63,0.13), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(100,80,255,0.15), transparent 50%);
    animation: drift 20s ease-in-out infinite alternate;
    z-index: -2;
  }
  @keyframes drift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(5%, -5%) rotate(8deg); }
  }

  /* Floating film grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 1px;
    z-index: -1;
    pointer-events: none;
    opacity: 0.6;
  }

  /* Custom cursor follow (desktop) */
  .cursor-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,56,96,0.18), transparent 60%);
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: screen;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    opacity: 0;
    will-change: transform;
  }
  @media (hover: hover) {
    .cursor-glow { opacity: 1; }
  }

  /* ============ HEADER ============ */
  header {
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 2;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: logoGlow 3s ease-in-out infinite alternate;
  }
  @keyframes logoGlow {
    from { filter: drop-shadow(0 0 8px rgba(255,56,96,0.3)); }
    to { filter: drop-shadow(0 0 18px rgba(255,210,63,0.5)); }
  }
  .logo span { color: var(--text); -webkit-text-fill-color: var(--text); }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .tag .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(74,222,128,0.6); }
    50% { opacity: 0.6; transform: scale(1.2); box-shadow: 0 0 0 6px rgba(74,222,128,0); }
  }

  /* ============ HERO ============ */
  .hero {
    text-align: center;
    padding: 30px 16px 20px;
    position: relative;
    z-index: 2;
  }
  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(54px, 14vw, 160px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: slideUp 0.9s cubic-bezier(.2,.9,.3,1.2) 0.1s forwards;
  }
  .hero h1 .em {
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 900;
    animation: gradientShift 6s ease-in-out infinite;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: none; }
  }
  .hero p {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0;
    animation: slideUp 0.9s 0.3s forwards;
  }

  /* ============ SEARCH ============ */
  .search-wrap {
    margin: 30px auto 16px;
    max-width: 640px;
    padding: 0 16px;
    position: relative;
    z-index: 2;
    opacity: 0;
    animation: slideUp 0.9s 0.5s forwards;
  }
  .search-bar {
    position: relative;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 4px 4px 4px 20px;
    display: flex;
    align-items: center;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: all 0.4s cubic-bezier(.2,.9,.3,1.2);
  }
  .search-bar::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 999px;
    padding: 1.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3), var(--accent));
    background-size: 300% 100%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s;
    animation: shimmer 4s linear infinite;
    pointer-events: none;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .search-bar:focus-within {
    transform: translateY(-2px);
    box-shadow: 0 20px 50px -20px rgba(255,56,96,0.6);
  }
  .search-bar:focus-within::before { opacity: 1; }

  .search-icon {
    width: 20px; height: 20px;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.4s;
  }
  .search-bar:focus-within .search-icon {
    color: var(--accent);
    transform: rotate(-90deg) scale(1.15);
  }
  .search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 14px 12px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 500;
    min-width: 0;
  }
  .search-bar input::placeholder { color: var(--muted); transition: opacity 0.3s; }
  .search-bar:focus-within input::placeholder { opacity: 0.4; }
  .search-clear {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    width: 36px;
    height: 36px;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8) rotate(-90deg);
    transition: all 0.3s cubic-bezier(.2,.9,.3,1.2);
    pointer-events: none;
    flex-shrink: 0;
  }
  .search-clear.visible { opacity: 1; transform: scale(1) rotate(0); pointer-events: auto; }
  .search-clear:hover { background: var(--accent2); color: var(--bg); transform: scale(1.1) rotate(90deg); }

  /* ============ CATEGORY TABS (genres) ============ */
  .categories {
    position: relative;
    z-index: 2;
    opacity: 0;
    animation: slideUp 0.9s 0.7s forwards;
  }
  .cat-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 14px 16px 6px;
    scrollbar-width: none;
  }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-row + .cat-row { padding-top: 0; }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 16px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    cursor: pointer;
    color: var(--muted);
    background: rgba(255,255,255,0.02);
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.25s cubic-bezier(.2,.9,.3,1.2);
    position: relative;
    overflow: hidden;
  }
  .chip::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
    z-index: -1;
  }
  .chip:hover {
    color: var(--text);
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .chip.active {
    color: white;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px -6px rgba(255,56,96,0.5);
  }
  .chip.active::before { opacity: 1; }
  .chip .ico { margin-right: 5px; }

  /* ============ RESULT INFO ============ */
  .result-info {
    text-align: center;
    margin: 20px 0 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }
  .result-info b { color: var(--accent2); font-size: 13px; }

  /* ============ GRID ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
    padding: 0 14px 60px;
    max-width: 1600px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }
  @media (min-width: 768px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 26px; padding: 0 5vw 80px; }
  }

  .movie {
    position: relative;
    aspect-ratio: 2/3;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg2);
    transform: translateY(40px);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(.2,.9,.3,1.2);
  }
  .movie.in-view {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.7s, transform 0.7s cubic-bezier(.2,.9,.3,1.2);
  }
  .movie:active { transform: scale(0.95); }

  @media (hover: hover) {
    .movie {
      transition: transform 0.5s cubic-bezier(.2,.9,.3,1.2), box-shadow 0.5s, z-index 0s 0.5s;
    }
    .movie.in-view { transition: opacity 0.7s, transform 0.7s cubic-bezier(.2,.9,.3,1.2); }
    .movie.in-view:hover {
      transform: scale(1.15) translateY(-6px);
      z-index: 10;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.9), 0 0 0 2px var(--accent), 0 0 40px rgba(255,56,96,0.4);
      transition: transform 0.4s cubic-bezier(.2,.9,.3,1.2), box-shadow 0.4s, z-index 0s;
    }
    .movie.in-view:hover .poster .title { transform: translateY(-4px); }
    .movie.in-view:hover .info { transform: translateY(0); }
  }

  .movie .poster {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 14px;
    color: white;
    background-size: cover;
    background-position: center;
    transition: transform 0.6s;
  }
  .movie:hover .poster { transform: scale(1.05); }
  .movie .poster::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 40%, rgba(0,0,0,0.9));
    transition: opacity 0.4s;
  }
  .movie .poster > * { position: relative; z-index: 1; }
  .movie .poster .top {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    opacity: 0.9;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .movie .poster .top .badge {
    background: rgba(255,56,96,0.9);
    color: white;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 8px;
    letter-spacing: 0.15em;
  }
  .movie .poster .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(16px, 4vw, 26px);
    line-height: 0.95;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    transition: transform 0.4s;
  }
  .movie .poster .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .movie .poster .rating { color: var(--accent2); font-weight: 500; }

  /* hover info card */
  .movie .info {
    position: absolute;
    inset: auto 0 0 0;
    padding: 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.97));
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(.2,.9,.3,1.2);
    z-index: 3;
  }
  .movie .info h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 0.03em;
    margin-bottom: 4px;
  }
  .movie .info p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .no-results, .loader {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-size: 12px;
    display: none;
    position: relative;
    z-index: 2;
  }
  .no-results.show, .loader.show { display: block; }
  .no-results .big {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px;
    color: var(--accent);
    margin-bottom: 8px;
    animation: glitch 3s infinite;
  }
  @keyframes glitch {
    0%, 90%, 100% { transform: translate(0); }
    91% { transform: translate(-3px, 0); text-shadow: 2px 0 var(--accent2), -2px 0 var(--accent3); }
    92% { transform: translate(3px, 0); }
    93% { transform: translate(0); text-shadow: none; }
  }
  .loader .spinner {
    display: inline-block;
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-right-color: var(--accent2);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: none;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal-overlay.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg);
    width: 100%;
    min-height: 100vh;
    position: relative;
    animation: modalIn 0.5s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes modalIn {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (min-width: 768px) {
    .modal-overlay {
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      align-items: flex-start;
      justify-content: center;
      padding: 30px 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      max-width: 900px;
      min-height: auto;
      max-height: calc(100vh - 60px);
      overflow-y: auto;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background: var(--bg2);
    }
  }
  .modal-close {
    position: fixed;
    top: 14px;
    right: 14px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
    z-index: 105;
    transition: transform 0.3s, background 0.3s;
  }
  .modal-close:hover { background: var(--accent); transform: rotate(90deg); }
  @media (min-width: 768px) { .modal-close { position: absolute; } }
  .modal-backdrop {
    aspect-ratio: 16/9;
    background-size: cover;
    background-position: center;
    position: relative;
    background-color: var(--bg2);
  }
  .modal-backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 30%, var(--bg));
  }
  @media (min-width: 768px) {
    .modal-backdrop { border-radius: 20px 20px 0 0; }
    .modal-backdrop::after { background: linear-gradient(transparent 30%, var(--bg2)); }
  }
  .modal-content { padding: 0 18px 40px; margin-top: -50px; position: relative; z-index: 2; }
  @media (min-width: 768px) { .modal-content { padding: 0 32px 32px; margin-top: -60px; } }
  .modal-content h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 6vw, 52px);
    line-height: 1;
    margin-bottom: 12px;
  }
  .modal-meta {
    display: flex;
    gap: 10px 14px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .modal-meta span.rating { color: var(--accent2); }
  .modal-overview {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(245,245,247,0.85);
    margin-bottom: 24px;
  }
  .modal-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .server-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 12px;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .server-tabs::-webkit-scrollbar { display: none; }
  .server-btn {
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 9px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.25s;
  }
  .server-btn:hover { color: var(--text); border-color: var(--accent); }
  .server-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .player-wrap { position: relative; width: 100%; }
  .modal-trailer {
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 10px;
    border: none;
    background: #000;
    display: block;
  }
  .fs-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.75);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .player-wrap.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .player-wrap.fullscreen .modal-trailer {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
    border-radius: 0;
  }
  .player-wrap.fullscreen .fs-btn { top: 12px; right: 12px; background: rgba(0,0,0,0.9); padding: 10px 14px; }
  .player-note {
    font-size: 10px;
    color: var(--muted);
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    line-height: 1.6;
  }
  .open-external {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 18px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: transform 0.2s, background 0.2s;
  }
  .open-external:hover { background: var(--accent2); color: var(--bg); transform: translateY(-2px); }

  footer {
    text-align: center;
    padding: 30px 20px 40px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }
  footer span { color: var(--accent); animation: heartbeat 1.5s ease-in-out infinite; display: inline-block; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>

<header>
  <div class="logo">CINE<span>VERSE</span></div>
  <div class="tag"><span class="dot"></span>LIVE · POWERED BY TMDB</div>
</header>

<section class="hero">
  <h1>Your <span class="em">Cinematic</span> Universe.</h1>
  <p>· every genre · every era · one tap away ·</p>
</section>

<div class="search-wrap">
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
    <input id="search" type="text" placeholder="Search any movie…" autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="search-clear" id="clearBtn">✕</button>
  </div>
</div>

<!-- Two rows of category chips -->
<div class="categories">
  <div class="cat-row" id="catRow1"></div>
  <div class="cat-row" id="catRow2"></div>
</div>

<div class="result-info"><b id="count">0</b> &nbsp;/&nbsp; <span id="total">0</span> &nbsp;films loaded</div>

<div class="loader show" id="loader">
  <div class="spinner"></div>
  Loading the universe…
</div>

<main class="grid" id="grid"></main>

<div class="no-results" id="noResults">
  <span class="big">404</span>
  No film found in this dimension.
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <div class="modal-meta" id="modalMeta"></div>
      <p class="modal-overview" id="modalOverview"></p>
      <div id="modalTrailerWrap"></div>
    </div>
  </div>
</div>

<footer>© 2026 Cineverse · made with <span>♥</span> for cinephiles</footer>

<script>
  const API_KEY = '847867524ffc4902379ee49173684256';
  const BASE = 'https://api.themoviedb.org/3';
  const IMG = 'https://image.tmdb.org/t/p/w500';
  const IMG_HD = 'https://image.tmdb.org/t/p/original';

  // TMDB genre IDs
  const CATEGORIES = [
    // Row 1: collections
    { name: 'Popular', type: 'list', value: 'popular', ico: '🔥' },
    { name: 'Top Rated', type: 'list', value: 'top_rated', ico: '⭐' },
    { name: 'Now Playing', type: 'list', value: 'now_playing', ico: '▶' },
    { name: 'Upcoming', type: 'list', value: 'upcoming', ico: '⏭' },
    { name: 'Trending', type: 'trending', value: 'day', ico: '⚡' },
    // Row 2: genres
    { name: 'Action', type: 'genre', value: 28, ico: '💥' },
    { name: 'Adventure', type: 'genre', value: 12, ico: '🗺' },
    { name: 'Romance', type: 'genre', value: 10749, ico: '❤' },
    { name: 'Horror', type: 'genre', value: 27, ico: '👻' },
    { name: 'Thriller', type: 'genre', value: 53, ico: '🔪' },
    { name: 'Sci-Fi', type: 'genre', value: 878, ico: '🛸' },
    { name: 'Comedy', type: 'genre', value: 35, ico: '😂' },
    { name: 'Drama', type: 'genre', value: 18, ico: '🎭' },
    { name: 'Animation', type: 'genre', value: 16, ico: '🎨' },
    { name: 'Fantasy', type: 'genre', value: 14, ico: '🧙' },
    { name: 'Mystery', type: 'genre', value: 9648, ico: '🔍' },
    { name: 'Crime', type: 'genre', value: 80, ico: '🕵' },
    { name: 'Family', type: 'genre', value: 10751, ico: '👨‍👩‍👧' },
    { name: 'War', type: 'genre', value: 10752, ico: '⚔' },
    { name: 'Western', type: 'genre', value: 37, ico: '🤠' },
    { name: 'Music', type: 'genre', value: 10402, ico: '🎵' },
    { name: 'Classic', type: 'classic', value: '', ico: '🎞' }
  ];

  const grid = document.getElementById('grid');
  const input = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const totalEl = document.getElementById('total');
  const noResults = document.getElementById('noResults');
  const loader = document.getElementById('loader');
  const catRow1 = document.getElementById('catRow1');
  const catRow2 = document.getElementById('catRow2');
  const modal = document.getElementById('modal');
  const modalClose = document.getElementById('modalClose');
  const modalBackdrop = document.getElementById('modalBackdrop');
  const modalTitle = document.getElementById('modalTitle');
  const modalMeta = document.getElementById('modalMeta');
  const modalOverview = document.getElementById('modalOverview');
  const modalTrailerWrap = document.getElementById('modalTrailerWrap');
  const cursorGlow = document.getElementById('cursorGlow');

  let currentMovies = [];
  let searchTimeout = null;
  let activeRequest = 0;

  // Render category chips
  function renderCategories() {
    CATEGORIES.forEach((cat, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip' + (i === 0 ? ' active' : '');
      chip.dataset.idx = i;
      chip.innerHTML = `<span class="ico">${cat.ico}</span>${cat.name}`;
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        input.value = '';
        clearBtn.classList.remove('visible');
        loadCategory(cat);
      });
      // first 5 in row 1, rest in row 2
      if (i < 5) catRow1.appendChild(chip);
      else catRow2.appendChild(chip);
    });
  }

  function buildUrl(cat, page) {
    if (cat.type === 'list') {
      return `${BASE}/movie/${cat.value}?api_key=${API_KEY}&language=en-US&page=${page}`;
    }
    if (cat.type === 'trending') {
      return `${BASE}/trending/movie/${cat.value}?api_key=${API_KEY}&page=${page}`;
    }
    if (cat.type === 'genre') {
      return `${BASE}/discover/movie?api_key=${API_KEY}&language=en-US&sort_by=popularity.desc&include_adult=false&with_genres=${cat.value}&page=${page}`;
    }
    if (cat.type === 'classic') {
      // Movies before 1990, sorted by rating
      return `${BASE}/discover/movie?api_key=${API_KEY}&language=en-US&sort_by=vote_average.desc&vote_count.gte=500&primary_release_date.lte=1990-12-31&page=${page}`;
    }
    return '';
  }

  async function fetchMultiplePages(urlBuilder, pages = 3) {
    const myRequest = ++activeRequest;
    loader.classList.add('show');
    grid.innerHTML = '';
    noResults.classList.remove('show');
    countEl.textContent = 0;
    totalEl.textContent = 0;
    try {
      const requests = [];
      for (let p = 1; p <= pages; p++) requests.push(fetch(urlBuilder(p)).then(r => r.json()));
      const results = await Promise.all(requests);
      if (myRequest !== activeRequest) return;
      const seen = new Set();
      currentMovies = [];
      for (const data of results) {
        for (const m of (data.results || [])) {
          if (m.poster_path && !seen.has(m.id)) {
            seen.add(m.id);
            currentMovies.push(m);
          }
        }
      }
      render();
    } catch (err) {
      console.error(err);
      if (myRequest === activeRequest) {
        grid.innerHTML = '<p style="color:var(--muted); text-align:center; padding: 40px; grid-column: 1/-1;">Failed to load. Check your internet.</p>';
      }
    } finally {
      if (myRequest === activeRequest) loader.classList.remove('show');
    }
  }

  function loadCategory(cat) {
    fetchMultiplePages(p => buildUrl(cat, p), 4);
  }

  function searchMovies(query) {
    fetchMultiplePages(p => `${BASE}/search/movie?api_key=${API_KEY}&language=en-US&query=${encodeURIComponent(query)}&page=${p}&include_adult=false`, 3);
  }

  function render() {
    if (currentMovies.length === 0) {
      noResults.classList.add('show');
      return;
    }
    grid.innerHTML = currentMovies.map(m => {
      const year = m.release_date ? m.release_date.slice(0, 4) : 'TBA';
      const rating = m.vote_average ? m.vote_average.toFixed(1) : 'N/A';
      const poster = m.poster_path ? `${IMG}${m.poster_path}` : '';
      const safeTitle = (m.title || '').replace(/"/g, '&quot;');
      const isNew = m.release_date && new Date(m.release_date).getFullYear() >= 2025;
      return `
        <article class="movie" data-id="${m.id}">
          <div class="poster" style="background-image: url('${poster}')">
            <div class="top">
              <span>${year}</span>
              ${isNew ? '<span class="badge">NEW</span>' : ''}
            </div>
            <div class="title">${safeTitle}</div>
            <div class="bottom">
              <span>${(m.original_language || '').toUpperCase()}</span>
              <span class="rating">★ ${rating}</span>
            </div>
          </div>
          <div class="info">
            <h3>${safeTitle}</h3>
            <p>${year} · ★ ${rating}</p>
          </div>
        </article>
      `;
    }).join('');
    totalEl.textContent = currentMovies.length;
    countEl.textContent = currentMovies.length;

    // Wire up clicks and observe for animation
    const cards = grid.querySelectorAll('.movie');
    cards.forEach(card => {
      card.addEventListener('click', () => openModal(card.dataset.id));
    });

    // Scroll-in animation via IntersectionObserver
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    cards.forEach(c => io.observe(c));
  }

  async function openModal(id) {
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
    modal.scrollTop = 0;
    window.scrollTo(0, 0);
    modalTitle.textContent = 'Loading…';
    modalMeta.innerHTML = '';
    modalOverview.textContent = '';
    modalTrailerWrap.innerHTML = '';
    modalBackdrop.style.backgroundImage = '';

    try {
      const detailsRes = await fetch(`${BASE}/movie/${id}?api_key=${API_KEY}&language=en-US`);
      const details = await detailsRes.json();

      modalBackdrop.style.backgroundImage = details.backdrop_path
        ? `url('${IMG_HD}${details.backdrop_path}')`
        : (details.poster_path ? `url('${IMG_HD}${details.poster_path}')` : '');
      modalTitle.textContent = details.title || 'Unknown';

      const year = details.release_date ? details.release_date.slice(0, 4) : 'TBA';
      const runtime = details.runtime ? `${details.runtime} min` : '';
      const genres = (details.genres || []).map(g => g.name).join(' · ');
      const rating = details.vote_average ? `★ ${details.vote_average.toFixed(1)}` : '';

      modalMeta.innerHTML = `
        <span>${year}</span>
        ${runtime ? `<span>${runtime}</span>` : ''}
        ${genres ? `<span>${genres}</span>` : ''}
        ${rating ? `<span class="rating">${rating}</span>` : ''}
      `;
      modalOverview.textContent = details.overview || 'No overview available.';

      const servers = [
        { name: 'VidLink', url: `https://vidlink.pro/movie/${id}` },
        { name: 'VidBinge', url: `https://vidbinge.dev/embed/movie/${id}` },
        { name: 'VidSrc.cc', url: `https://vidsrc.cc/v2/embed/movie/${id}` },
        { name: 'VidSrc.dev', url: `https://vidsrc.dev/embed/movie/${id}` },
        { name: 'AutoEmbed', url: `https://player.autoembed.cc/embed/movie/${id}` },
        { name: 'VidSrc.to', url: `https://vidsrc.to/embed/movie/${id}` },
        { name: 'VidSrc.xyz', url: `https://vidsrc.xyz/embed/movie/${id}` },
        { name: 'Embed.su', url: `https://embed.su/embed/movie/${id}` },
        { name: '2Embed', url: `https://www.2embed.cc/embed/${id}` },
        { name: 'MultiEmbed', url: `https://multiembed.mov/?video_id=${id}&tmdb=1` }
      ];
      modalTrailerWrap.innerHTML = `
        <div class="modal-section-title">⟶ Watch Movie</div>
        <div class="server-tabs">
          ${servers.map((s, i) => `<button class="server-btn ${i===0?'active':''}" data-url="${s.url}">${s.name}</button>`).join('')}
        </div>
        <div class="player-wrap" id="playerWrap">
          <button class="fs-btn" id="fsBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
              <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
              <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
              <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            </svg>
            FULLSCREEN
          </button>
          <iframe id="moviePlayer" class="modal-trailer"
            src="${servers[0].url}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
            allowfullscreen webkitallowfullscreen mozallowfullscreen
            referrerpolicy="origin" loading="lazy"></iframe>
        </div>
        <a class="open-external" href="${servers[0].url}" target="_blank" rel="noopener" id="openExternal">⟶ Open in new tab</a>
        <p class="player-note">
          ⚠ Player blank ho ya na chale → naya server try karo, ya "Open in new tab" tap karo. Pakistan/India mein <b>1.1.1.1 Cloudflare WARP</b> VPN on rakho.
        </p>
      `;

      const openExtLink = document.getElementById('openExternal');
      const playerWrap = document.getElementById('playerWrap');
      const fsBtn = document.getElementById('fsBtn');

      modalTrailerWrap.querySelectorAll('.server-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          modalTrailerWrap.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('moviePlayer').src = btn.dataset.url;
          openExtLink.href = btn.dataset.url;
        });
      });

      fsBtn.addEventListener('click', async () => {
        const isFS = playerWrap.classList.contains('fullscreen');
        if (!isFS) {
          playerWrap.classList.add('fullscreen');
          fsBtn.lastChild.textContent = ' EXIT';
          try { if (playerWrap.requestFullscreen) await playerWrap.requestFullscreen(); else if (playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen(); } catch(e) {}
          try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {}); } catch(e) {}
        } else {
          playerWrap.classList.remove('fullscreen');
          fsBtn.lastChild.textContent = ' FULLSCREEN';
          try { if (document.exitFullscreen) await document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch(e) {}
          try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e) {}
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && playerWrap.classList.contains('fullscreen')) {
          playerWrap.classList.remove('fullscreen');
          if (fsBtn.lastChild) fsBtn.lastChild.textContent = ' FULLSCREEN';
        }
      });
    } catch (err) {
      modalOverview.textContent = 'Failed to load details.';
    }
  }

  function closeModal() {
    modal.classList.remove('show');
    document.body.style.overflow = '';
    modalTrailerWrap.innerHTML = '';
  }

  modalClose.addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('show')) closeModal();
  });

  // Search
  input.addEventListener('input', e => {
    const q = e.target.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));

    clearTimeout(searchTimeout);
    if (q.length === 0) {
      document.querySelector('.chip').classList.add('active');
      loadCategory(CATEGORIES[0]);
      return;
    }
    if (q.length < 2) return;
    searchTimeout = setTimeout(() => searchMovies(q), 500);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
      const q = input.value.trim();
      if (q.length > 0) {
        clearTimeout(searchTimeout);
        searchMovies(q);
      }
    }
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('visible');
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    document.querySelector('.chip').classList.add('active');
    loadCategory(CATEGORIES[0]);
  });

  // Cursor glow follow (desktop)
  let mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  function animateGlow() {
    glowX += (mouseX - glowX) * 0.12;
    glowY += (mouseY - glowY) * 0.12;
    cursorGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
    requestAnimationFrame(animateGlow);
  }
  animateGlow();

  // Init
  renderCategories();
  loadCategory(CATEGORIES[0]);
</script>

</body>
</html>
